<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect width="1200" height="960" fill="#ffffff"/>

  <text x="40" y="36" font-size="20" font-weight="700" fill="#0f172a">test_agent · Agent 开发与评测平台</text>
  <text x="40" y="58" font-size="13" fill="#475569">数据流按真实代码绘制：入口 → 接入 → 执行 → 轨迹 → 判分 → 学习 → 数据，右侧闭环为经验注入</text>

  <!-- 带 1 入口 -->
  <rect x="40" y="76" width="1120" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="122" font-size="14" font-weight="700" fill="#64748b">入口</text>

  <rect x="152" y="90" width="320" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="170" y="112" font-size="13" font-weight="700" fill="#0c4a6e">CLI 脚本</text>
  <text x="170" y="132" font-size="11.5" fill="#0c4a6e">run_shop.py · run_loop.py · run_agent.py</text>

  <rect x="492" y="90" width="300" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="510" y="112" font-size="13" font-weight="700" fill="#0c4a6e">HTTP 门面</text>
  <text x="510" y="132" font-size="11.5" fill="#0c4a6e">api/app.py · 127.0.0.1:8020</text>

  <rect x="812" y="90" width="336" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="830" y="112" font-size="13" font-weight="700" fill="#0c4a6e">画布 Builder</text>
  <text x="830" y="132" font-size="11.5" fill="#0c4a6e">web/builder/ · 零依赖 JS + SVG · 拖拽生成 JSON</text>

  <line x1="654" y1="160" x2="654" y2="182" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 带 2 接入 -->
  <rect x="40" y="184" width="1120" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="244" font-size="14" font-weight="700" fill="#64748b">接入</text>

  <rect x="152" y="196" width="996" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="170" y="215" font-size="12.5" font-weight="700" fill="#14532d">agents/builtin.py　名字 → 工厂；wf:&lt;id&gt; 动态路由到磁盘定义，不重启即可跑</text>
  <text x="170" y="232" font-size="11" fill="#166534">6 个内置（shop-cold / shop-tuned / main / customer / customer-cold / workflow）+ 5 个 wf:*</text>

  <rect x="152" y="248" width="470" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="168" y="265" font-size="12" font-weight="700" fill="#14532d">原生 Agent：自己跑 ReAct 循环</text>
  <text x="168" y="281" font-size="11" fill="#166534">agents/shop · customer · main_agent　　调用记进 Turn.calls</text>

  <rect x="642" y="248" width="506" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="658" y="265" font-size="12" font-weight="700" fill="#14532d">agentplatform/：Workflow 引擎</text>
  <text x="658" y="281" font-size="11" fill="#166534">definition · schema · topology · executor · adapter · store</text>

  <line x1="654" y1="296" x2="654" y2="318" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 带 3 执行 -->
  <rect x="40" y="320" width="1120" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="372" font-size="14" font-weight="700" fill="#64748b">执行</text>

  <rect x="152" y="332" width="380" height="72" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="168" y="352" font-size="12.5" font-weight="700" fill="#78350f">core/runner.py</text>
  <text x="168" y="370" font-size="11" fill="#92400e">run_tasks → run_task：建 RunContext、</text>
  <text x="168" y="386" font-size="11" fill="#92400e">崩溃隔离成 status=crashed，不让一个 Agent 拖垮整批</text>

  <rect x="552" y="332" width="300" height="72" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="568" y="352" font-size="12.5" font-weight="700" fill="#78350f">core/protocol.py</text>
  <text x="568" y="370" font-size="11" fill="#92400e">Agent 协议：name + tools +</text>
  <text x="568" y="386" font-size="11" fill="#92400e">run(task, ctx) → Trace；ctx 带 experience</text>

  <rect x="872" y="332" width="276" height="72" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="888" y="352" font-size="12.5" font-weight="700" fill="#78350f">core/task.py</text>
  <text x="888" y="370" font-size="11" fill="#92400e">Task / split / user_turns()</text>
  <text x="888" y="386" font-size="11" fill="#92400e">多轮任务 = 多个 Turn</text>

  <line x1="654" y1="416" x2="654" y2="438" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 带 4 轨迹 -->
  <rect x="40" y="440" width="1120" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="492" font-size="14" font-weight="700" fill="#64748b">轨迹</text>

  <rect x="152" y="452" width="560" height="72" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="168" y="472" font-size="12.5" font-weight="700" fill="#4c1d95">core/trace.py　Turn ＋ Event 双层</text>
  <text x="168" y="490" font-size="11" fill="#5b21b6">Turn（对话）：index / user_input / calls / answer / steps</text>
  <text x="168" y="506" font-size="11" fill="#5b21b6">Event（执行）：kind / seq / node_id / args / output / ok / elapsed</text>

  <rect x="732" y="452" width="416" height="72" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="748" y="472" font-size="12.5" font-weight="700" fill="#4c1d95">落盘</text>
  <text x="748" y="490" font-size="11" fill="#5b21b6">runs/**/*.jsonl　＋　manifest.json</text>
  <text x="748" y="506" font-size="11" fill="#5b21b6">记数据集 SHA-256、split 条数、commit / dirty</text>

  <line x1="654" y1="536" x2="654" y2="558" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 带 5 判分 -->
  <rect x="40" y="560" width="1120" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="608" font-size="14" font-weight="700" fill="#64748b">判分</text>

  <rect x="152" y="572" width="996" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="168" y="592" font-size="12.5" font-weight="700" fill="#7f1d1d">evaluator/verdict.py　五层判定：工具选择 → 参数 → 顺序 → 事实 → 回答</text>
  <text x="168" y="610" font-size="11" fill="#991b1b">calls_of_turn(trace, turn)：有 events 走事件、无 events 走 Turn.calls，两者不相加　·　fail_nodes 定位到节点</text>
  <text x="168" y="626" font-size="11" fill="#991b1b">只吃 ToolCall，不认 Turn —— 所以 memory_call / branch / slot_reuse 事件不会污染工具计数</text>

  <line x1="654" y1="644" x2="654" y2="666" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 带 6 学习与回流 -->
  <rect x="40" y="668" width="1120" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="722" font-size="14" font-weight="700" fill="#64748b">学习</text>

  <rect x="152" y="680" width="320" height="80" rx="8" fill="#cffafe" stroke="#0e7490"/>
  <text x="168" y="700" font-size="12.5" font-weight="700" fill="#164e63">memory/　经验</text>
  <text x="168" y="718" font-size="11" fill="#155e75">extract → quality → store</text>
  <text x="168" y="734" font-size="11" fill="#155e75">→ retrieve → inject</text>
  <text x="168" y="750" font-size="10.5" fill="#0e7490">数字全拒、holdout 值黑名单</text>

  <rect x="492" y="680" width="320" height="80" rx="8" fill="#cffafe" stroke="#0e7490"/>
  <text x="508" y="700" font-size="12.5" font-weight="700" fill="#164e63">pipeline/　编排</text>
  <text x="508" y="718" font-size="11" fill="#155e75">learn · verify</text>
  <text x="508" y="734" font-size="11" fill="#155e75">sft（闸门）· provenance（来源）</text>
  <text x="508" y="750" font-size="10.5" fill="#0e7490">不做训练</text>

  <rect x="832" y="680" width="316" height="80" rx="8" fill="#cffafe" stroke="#0e7490"/>
  <text x="848" y="700" font-size="12.5" font-weight="700" fill="#164e63">scripts/　数据处理</text>
  <text x="848" y="718" font-size="11" fill="#155e75">distill · build_sft · merge_memory</text>
  <text x="848" y="734" font-size="11" fill="#155e75">轨迹 → SFT / 失败样本</text>
  <text x="848" y="750" font-size="10.5" fill="#0e7490">质量闸门：四分类 + split 隔离</text>

  <line x1="654" y1="772" x2="654" y2="794" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 带 7 数据产物 -->
  <rect x="40" y="796" width="1120" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="846" font-size="14" font-weight="700" fill="#64748b">数据</text>

  <rect x="152" y="808" width="996" height="68" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="168" y="828" font-size="12.5" font-weight="700" fill="#1e293b">data/　产物与定义</text>
  <text x="168" y="846" font-size="11" fill="#334155">workflows/*.json（图定义）　·　memory/experiences.jsonl（9 条唯一经验）　·　sft/{train 26, holdout 4, quarantine}</text>
  <text x="168" y="864" font-size="11" fill="#334155">distill/ · distill-main-a2/ · distill-wf/ · distill-wf-eval/（SFT 来源，各带 manifest provenance）　·　7 个任务集共 65 条</text>

  <!-- 右侧闭环：经验注入 -->
  <path d="M 1152 720 C 1186 720 1186 380 1152 380" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arw2)"/>
  <text x="1178" y="556" font-size="11" fill="#0e7490" transform="rotate(90 1178 556)">ctx.experience → llm 节点 prompt</text>

  <!-- 底部三条硬边界 -->
  <rect x="40" y="902" width="1120" height="46" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="58" y="921" font-size="11.5" fill="#78350f">三条硬边界（代码强制，不是口头约定）：① core/ 不 import agents / agentplatform / evaluator / memory；② Runtime 不埋点，trace = agent.run(task, ctx)，轨迹由 Agent 自产；</text>
  <text x="58" y="939" font-size="11.5" fill="#78350f">③ Workflow 产出 1 个 Turn + N 个 Event，Turn.calls 恒空 —— 判分器从事件里取调用，同一套判分器同时评原生 Agent 与 Workflow。</text>
</svg>
